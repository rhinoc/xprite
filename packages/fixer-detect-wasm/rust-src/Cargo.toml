[package]
name = "pixelfixer_detect"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustfft = "6"
wasm-bindgen = "0.2"
png = { version = "0.17", optional = true }

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = ["smoke"]

[features]
smoke = ["png"]

[profile.release]
lto = true
opt-level = "s"
