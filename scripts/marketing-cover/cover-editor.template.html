<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xprite · Cover Studio</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f5f6f8;
      color: #20232a;
      font:
        13px -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        Arial,
        sans-serif;
    }
    button,
    input,
    select,
    textarea {
      font: inherit;
    }
    button,
    select {
      cursor: pointer;
    }
    button {
      background: white;
      border: 1px solid #dfe2e8;
      border-radius: 7px;
      padding: 7px 11px;
      color: inherit;
    }
    button:hover {
      background: #f3f5f9;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    button.primary {
      background: #273eec;
      color: white;
      border-color: #273eec;
    }
    button.primary:hover {
      background: #1f32c5;
    }
    input,
    select,
    textarea {
      border: 1px solid #dfe2e8;
      border-radius: 6px;
      background: white;
      color: inherit;
      padding: 7px 8px;
      min-width: 0;
    }
    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid #c5ccff;
      outline-offset: 1px;
    }
    input[type="number"] {
      width: 76px;
    }
    input[type="color"] {
      padding: 2px;
      width: 44px;
      height: 32px;
    }
    textarea {
      resize: vertical;
      width: 100%;
      min-height: 86px;
      line-height: 1.5;
    }
    header {
      min-height: 66px;
      background: white;
      border-bottom: 1px solid #e4e6eb;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 20px;
      flex-wrap: wrap;
    }
    .identity {
      font-weight: 650;
      font-size: 16px;
      white-space: nowrap;
    }
    .identity span {
      color: #a1a5ae;
      margin: 0 8px;
      font-weight: 400;
    }
    .spacer {
      flex: 1;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .toolbar .dims {
      font-size: 11px;
      color: #9298a4;
    }
    .toolbar input {
      width: 64px;
      padding: 7px 4px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 188px minmax(340px, 1fr) 266px;
      height: calc(100vh - 111px);
    }
    aside {
      background: white;
      overflow: auto;
      padding: 18px 14px;
    }
    .layers {
      border-right: 1px solid #e4e6eb;
    }
    .properties {
      border-left: 1px solid #e4e6eb;
    }
    .section-title {
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #9398a3;
      margin: 0 0 13px;
    }
    .layer-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 5px;
    }
    .layer-row > button.name {
      flex: 1;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-color: transparent;
      background: transparent;
      padding: 8px 6px;
    }
    .layer-row.selected {
      background: #eef0ff;
      border-radius: 6px;
    }
    .layer-row.selected > button.name {
      color: #253ada;
    }
    .layer-row.hidden {
      opacity: 0.45;
    }
    .layer-row .visibility {
      border: none;
      background: none;
      padding: 5px;
      font-size: 14px;
      color: #9499a2;
    }
    .layer-actions {
      display: flex;
      gap: 7px;
      margin: 14px 0;
    }
    .stage-area {
      position: relative;
      overflow: hidden;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 44px 26px;
      background-color: #edeff3;
      background-image: radial-gradient(#cbd0d9 0.7px, transparent 0.7px);
      background-size: 14px 14px;
    }
    canvas {
      box-shadow: 0 5px 22px #242c4218;
      touch-action: none;
      display: block;
      outline: 1px solid #dfe2e8;
      cursor: default;
    }
    .stage-controls {
      position: absolute;
      left: 20px;
      top: 13px;
      display: flex;
      gap: 7px;
    }
    .stage-controls button {
      padding: 4px 8px;
      font-size: 12px;
    }
    .stage-label {
      position: absolute;
      bottom: 14px;
      color: #8b919d;
      font-size: 11px;
    }
    .field {
      margin-bottom: 15px;
    }
    .field > label {
      display: block;
      color: #737a86;
      font-size: 11px;
      margin: 0 0 6px;
    }
    .field input:not([type="color"]):not([type="checkbox"]),
    .field select {
      width: 100%;
    }
    .pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #626975;
      font-size: 12px;
      margin: 9px 0;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 18px;
      font-weight: 650;
    }
    .separator {
      border: 0;
      border-top: 1px solid #eceef2;
      margin: 19px 0;
    }
    .note {
      font-size: 12px;
      color: #989ea8;
      line-height: 1.7;
    }
    .image-button {
      width: 100%;
    }
    .danger {
      color: #bc4d59;
    }
    footer {
      height: 45px;
      border-top: 1px solid #e4e6eb;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 0 20px;
      color: #858b97;
      font-size: 11px;
    }
    .status {
      color: #52616b;
    }
    .empty {
      padding-top: 40px;
    }
    .file-hidden {
      display: none;
    }
    .dimensions-tag {
      font-variant-numeric: tabular-nums;
      color: #6c7481;
    }
    .small {
      font-size: 11px;
      color: #9198a3;
    }
    .preview-select {
      display: none;
    }
    .export-menu {
      position: relative;
    }
    .export-options {
      position: absolute;
      right: 0;
      top: 38px;
      z-index: 5;
      background: white;
      box-shadow: 0 10px 30px #2222;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 6px;
      min-width: 150px;
    }
    .export-options button {
      display: block;
      border: 0;
      width: 100%;
      text-align: left;
    }
    .export-options[hidden] {
      display: none;
    }
    @media (max-width: 1050px) {
      .workspace {
        grid-template-columns: minmax(340px, 1fr) 245px;
      }
      .layers {
        display: none;
      }
      .preview-select {
        display: block;
      }
      .identity {
        font-size: 14px;
      }
      .toolbar {
        gap: 4px;
      }
      header {
        gap: 10px;
        padding: 10px;
      }
      .stage-area {
        padding: 40px 15px;
      }
    }
    @media (max-width: 680px) {
      .workspace {
        height: auto;
        display: flex;
        flex-direction: column;
      }
      .stage-area {
        min-height: 420px;
      }
      .properties {
        border-top: 1px solid #ddd;
        border-left: 0;
        max-height: none;
      }
      footer {
        height: auto;
        min-height: 45px;
      }
      .spacer {
        display: none;
      }
      header {
        justify-content: space-between;
      }
      .identity {
        width: 100%;
      }
    }
  </style>
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      flex-shrink: 0;
    }
    .workspace {
      flex: 1;
      height: auto;
      min-height: 0;
    }
    .status:empty {
      display: none;
    }
    .status {
      font-size: 11px;
      white-space: nowrap;
    }
    .note,
    .small {
      display: none;
    }
  </style>
  <header>
    <div class="identity">Xprite <span>/</span> Cover Studio</div>
    <div class="toolbar">
      <select id="template" aria-label="Cover preset">
        <option value="630x500-zh">itch · Chinese</option>
        <option value="630x500-en">itch · English</option>
        <option value="1920x1080-zh">Wide · Chinese</option>
        <option value="1920x1080-en">Wide · English</option>
      </select>
      <input id="canvas-width" type="number" min="1" max="8192" aria-label="Canvas width" /><span
        class="dims"
        >×</span
      ><input
        id="canvas-height"
        type="number"
        min="1"
        max="8192"
        aria-label="Canvas height"
      /><button id="apply-size">Apply size</button>
    </div>
    <div class="spacer"></div>
    <div class="toolbar">
      <button id="undo" title="Undo ⌘Z" aria-label="Undo">↶</button
      ><button id="redo" title="Redo ⇧⌘Z" aria-label="Redo">↷</button
      ><button id="load-project">Open project</button
      ><button id="apply-layout">Apply layout…</button><button id="save-project">Save layout</button
      ><select id="export-scale" aria-label="Export scale">
        <option value="1">1×</option>
        <option value="2">2×</option>
        <option value="3">3×</option></select
      ><button id="export-png" class="primary">Export PNG</button
      ><span id="status" class="status"></span>
    </div>
  </header>
  <main class="workspace">
    <aside class="layers">
      <div class="section-title">Layers</div>
      <div id="layer-list"></div>
      <div class="layer-actions">
        <button id="add-text">+ Text</button><button id="add-image">+ Image</button>
      </div>
      <hr class="separator" />
      <button id="copy-layout" style="width: 100%; margin-bottom: 9px">Copy to Chinese</button
      ><button id="reset-layout">Reset preset</button>
    </aside>
    <section class="stage-area" id="stage-area">
      <div class="stage-controls">
        <button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-label">Fit</button
        ><button id="zoom-in" aria-label="Zoom in">＋</button
        ><label class="row"><input id="snapping" type="checkbox" checked /> Snap</label
        ><select id="divisions" aria-label="Canvas divisions">
          <option value="2">Halves</option>
          <option value="3" selected>Thirds</option>
          <option value="4">Quarters</option></select
        ><select id="layer-picker" class="preview-select" aria-label="Select layer"></select>
      </div>
      <canvas id="stage" aria-label="Cover canvas"></canvas>
      <div class="stage-label" id="stage-label"></div>
    </section>
    <aside class="properties"><div id="inspector"></div></aside>
  </main>
  <input
    id="image-file"
    type="file"
    accept="image/png,image/jpeg,image/webp,image/svg+xml"
    class="file-hidden"
  /><input id="project-file" type="file" accept="application/json,.json" class="file-hidden" />
  <script id="cover-bundle" type="application/json">
    __COVER_BUNDLE__
  </script>
  <script>
    (() => {
      "use strict";
      const bundle = JSON.parse(document.getElementById("cover-bundle").textContent);
      const $ = (id) => document.getElementById(id);
      const clone = (value) => JSON.parse(JSON.stringify(value));
      const STORAGE_KEY = "xprite.cover-studio.v2";
      const SNAP_DISTANCE = 6,
        NEARBY_DISTANCE = 80,
        MIN_SCALE = 0.05;
      const SYSTEM_FONT = '-apple-system,"PingFang SC",Arial,sans-serif';
      const canvas = $("stage"),
        ctx = canvas.getContext("2d", { colorSpace: "srgb" });
      const images = new Map(),
        assets = { ...bundle.assets };
      let documents = clone(bundle.templates),
        active = bundle.defaultTemplate;
      let selected = "headline",
        zoom = 1,
        manualZoom = false,
        drag = null,
        pendingAsset = null;
      let undoStack = [],
        redoStack = [],
        saveTimer,
        paintPending = false,
        ready = false,
        fieldRecorded = false;
      let snapGuides = [],
        importMode = "open";
      const status = (text) => ($("status").textContent = text);
      const doc = () => documents[active];
      const layer = () => doc().layers.find((item) => item.id === selected);
      const family = (font) =>
        bundle.fonts[font] ? '"Cover-' + font + '"' : font === "Arial" ? "Arial" : SYSTEM_FONT;
      const fontString = (item, size = item.fontSize) =>
        `${item.weight || 700} ${size}px ${family(item.font)}`;
      const round = (value) => Math.round(value * 10) / 10;
      const escape = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      const option = (value, label, current) =>
        `<option value="${escape(value)}" ${value === current ? "selected" : ""}>${escape(label)}</option>`;

      function loadImage(key, data) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            images.set(key, image);
            resolve(image);
          };
          image.onerror = () => reject(new Error("Could not load image"));
          image.src = data;
        });
      }
      function rrect(context, x, y, w, h, r) {
        context.beginPath();
        context.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
      }
      function shadow(context, amount = 1) {
        context.shadowColor = "rgba(18,25,40,.16)";
        context.shadowBlur = 15 * amount;
        context.shadowOffsetY = 5 * amount;
      }
      function noShadow(context) {
        context.shadowColor = "transparent";
        context.shadowBlur = 0;
        context.shadowOffsetY = 0;
      }
      function arrowPoints(item) {
        const a = { x: item.start.x * item.w, y: item.start.y * item.h },
          b = { x: item.end.x * item.w, y: item.end.y * item.h };
        const dx = b.x - a.x,
          dy = b.y - a.y;
        return {
          a,
          b,
          c: { x: (a.x + b.x) / 2 - dy * item.curvature, y: (a.y + b.y) / 2 + dx * item.curvature },
        };
      }
      function reframeArrow(item, a, b, curvature = item.curvature) {
        const dx = b.x - a.x,
          dy = b.y - a.y,
          c = { x: (a.x + b.x) / 2 - dy * curvature, y: (a.y + b.y) / 2 + dx * curvature };
        const pad = Math.max(item.strokeWidth * 4, 2),
          left = Math.min(a.x, b.x, c.x) - pad,
          top = Math.min(a.y, b.y, c.y) - pad;
        item.x = left;
        item.y = top;
        item.w = Math.max(1, Math.max(a.x, b.x, c.x) - left + pad);
        item.h = Math.max(1, Math.max(a.y, b.y, c.y) - top + pad);
        item.start = { x: (a.x - left) / item.w, y: (a.y - top) / item.h };
        item.end = { x: (b.x - left) / item.w, y: (b.y - top) / item.h };
        item.curvature = curvature;
      }
      function snapTargets(item) {
        const count = Number($("divisions").value),
          x = [0, doc().width / 2, doc().width],
          y = [0, doc().height / 2, doc().height];
        for (let index = 1; index < count; index++) {
          x.push((doc().width * index) / count);
          y.push((doc().height * index) / count);
        }
        const distance = (a0, a1, b0, b1) => Math.max(0, a0 - b1, b0 - a1);
        for (const other of doc().layers) {
          if (other.id === item.id || !other.visible) continue;
          if (
            distance(item.y, item.y + item.h, other.y, other.y + other.h) <=
            NEARBY_DISTANCE / zoom
          )
            x.push(other.x, other.x + other.w / 2, other.x + other.w);
          if (
            distance(item.x, item.x + item.w, other.x, other.x + other.w) <=
            NEARBY_DISTANCE / zoom
          )
            y.push(other.y, other.y + other.h / 2, other.y + other.h);
        }
        return {
          x: [...new Set(x)].filter((value) => value >= 0 && value <= doc().width),
          y: [...new Set(y)].filter((value) => value >= 0 && value <= doc().height),
        };
      }
      function nearest(features, targets) {
        let best = null;
        for (const feature of features)
          for (const target of targets) {
            const delta = target - feature;
            if (
              Math.abs(delta) <= SNAP_DISTANCE / zoom &&
              (!best || Math.abs(delta) < Math.abs(best.delta))
            )
              best = { target, delta };
          }
        return best;
      }
      function snapMove(item) {
        const targets = snapTargets(item),
          x = nearest([item.x, item.x + item.w / 2, item.x + item.w], targets.x),
          y = nearest([item.y, item.y + item.h / 2, item.y + item.h], targets.y);
        if (x) {
          item.x += x.delta;
          snapGuides.push({ axis: "x", value: x.target });
        }
        if (y) {
          item.y += y.delta;
          snapGuides.push({ axis: "y", value: y.target });
        }
      }
      function snapPoint(point, item) {
        const targets = snapTargets(item),
          result = { ...point },
          x = nearest([point.x], targets.x),
          y = nearest([point.y], targets.y);
        if (x) {
          result.x = x.target;
          snapGuides.push({ axis: "x", value: x.target });
        }
        if (y) {
          result.y = y.target;
          snapGuides.push({ axis: "y", value: y.target });
        }
        return result;
      }
      function snapResize(initial, handle, ratio) {
        const sx = handle.endsWith("w") ? -1 : 1,
          sy = handle.startsWith("n") ? -1 : 1;
        const anchor = {
          x: initial.x + (sx < 0 ? initial.w : 0),
          y: initial.y + (sy < 0 ? initial.h : 0),
        };
        const preview = {
          ...initial,
          x: sx < 0 ? anchor.x - initial.w * ratio : anchor.x,
          y: sy < 0 ? anchor.y - initial.h * ratio : anchor.y,
          w: initial.w * ratio,
          h: initial.h * ratio,
        };
        const targets = snapTargets(preview),
          candidates = [];
        for (const axis of ["x", "y"])
          for (const fraction of [1, 0.5]) {
            const direction = axis === "x" ? sx * initial.w : sy * initial.h,
              coefficient = direction * fraction;
            const feature = anchor[axis] + coefficient * ratio;
            for (const target of targets[axis]) {
              const difference = Math.abs(target - feature),
                next = (target - anchor[axis]) / coefficient;
              if (difference <= SNAP_DISTANCE / zoom && next >= MIN_SCALE)
                candidates.push({ axis, target, ratio: next, difference });
            }
          }
        candidates.sort((a, b) => a.difference - b.difference);
        if (!candidates.length) return ratio;
        const best = candidates[0];
        for (const candidate of candidates)
          if (Math.abs(candidate.ratio - best.ratio) * Math.max(initial.w, initial.h) < 0.6 / zoom)
            snapGuides.push({ axis: candidate.axis, value: candidate.target });
        return best.ratio;
      }

      function textMetrics(item, fit = false) {
        ctx.save();
        ctx.font = fontString(item);
        const lines = item.text.split("\n");
        if (fit) {
          const measured = Math.max(1, ...lines.map((line) => ctx.measureText(line).width));
          item.fontSize = Math.floor(
            Math.min(item.fontSize, (item.fontSize * (item.w - 4)) / measured),
          );
          ctx.font = fontString(item);
        }
        const content = Math.max(1, ...lines.map((line) => ctx.measureText(line).width));
        if (item.kind === "text") {
          item.w = content + (item.highlight ? 4 : 0);
          item.h =
            lines.length * item.fontSize * (item.lineHeight || 1.16) +
            (lines.length - 1) * (item.lineGap || 0);
        }
        if (item.kind === "github") {
          item.w = item.iconSize + item.gap + content;
          item.h = Math.max(item.iconSize, item.fontSize * 1.2);
        }
        ctx.restore();
        return lines;
      }

      function drawLayer(context, item) {
        context.save();
        context.translate(Math.round(item.x), Math.round(item.y));
        const w = item.w,
          h = item.h,
          image = images.get(item.asset);
        if (item.kind === "image") {
          context.imageSmoothingEnabled = item.asset !== "cursor";
          context.imageSmoothingQuality = "high";
          if (image) context.drawImage(image, 0, 0, w, h);
        }
        if (item.kind === "brand") {
          if (image) {
            context.save();
            rrect(context, 0, 0, h, h, h * 0.12);
            context.clip();
            context.imageSmoothingEnabled = false;
            context.drawImage(image, 0, 0, h, h);
            context.restore();
          }
          context.font = `700 ${item.fontSize}px Arial`;
          context.fillStyle = item.color;
          context.textBaseline = "alphabetic";
          context.fillText(item.text, h + h * 0.094, h * 0.79);
        }
        if (item.kind === "text") {
          context.font = fontString(item);
          context.textBaseline = "top";
          context.fillStyle = item.color;
          const lineHeight = item.fontSize * (item.lineHeight || 1.16) + (item.lineGap || 0);
          item.text.split("\n").forEach((line, index) => {
            const y = index * lineHeight;
            if (item.highlight && line.includes(item.highlight)) {
              const start = line.indexOf(item.highlight),
                prefix = line.slice(0, start);
              const x = context.measureText(prefix).width,
                length = context.measureText(item.highlight).width;
              context.fillStyle = item.highlightColor || "#fff4a7";
              context.fillRect(x - 2, y - 1, length + 4, item.fontSize * 1.1);
              context.fillStyle = item.color;
            }
            context.fillText(line, 0, y);
          });
        }
        if (item.kind === "github") {
          if (image)
            context.drawImage(image, 0, (h - item.iconSize) / 2, item.iconSize, item.iconSize);
          context.font = fontString(item);
          context.fillStyle = item.color;
          context.textBaseline = "middle";
          context.fillText(item.text, item.iconSize + item.gap, h / 2);
        }
        if (item.kind === "desktop") {
          shadow(context, w / 600);
          rrect(context, 0, 0, w, h, w * 0.0125);
          context.fillStyle = "#f2f3f5";
          context.fill();
          noShadow(context);
          context.save();
          rrect(context, 0, 0, w, h, w * 0.0125);
          context.clip();
          const bar = item.bar;
          context.fillStyle = "#f2f3f5";
          context.fillRect(0, 0, w, bar);
          const dot = bar * 0.137;

          if (drag.handle === "end") Object.assign(b, target);
          if (drag.handle === "curve") {
            const vx = b.x - a.x,
              vy = b.y - a.y;
            curvature = Math.max(
              -2,
              Math.min(
                2,
                ((target.x - (a.x + b.x) / 2) * -vy + (target.y - (a.y + b.y) / 2) * vx) /
                  Math.max(1, vx * vx + vy * vy),
              ),
            );
          }
          Object.assign(item, clone(initial));
          reframeArrow(item, a, b, curvature);
        } else if (drag.handle) {
          const initial = drag.initial;
          let dw = drag.handle.endsWith("w") ? -dx : dx,
            dh = drag.handle.startsWith("n") ? -dy : dy;
          let ratio = Math.max(
            MIN_SCALE,
            1 + (dw * initial.w + dh * initial.h) / (initial.w * initial.w + initial.h * initial.h),
          );
          if (snapping) ratio = snapResize(initial, drag.handle, ratio);
          Object.assign(item, clone(initial));
          resizeLayer(item, ratio);
          if (drag.handle.endsWith("w")) item.x = initial.x + initial.w - item.w;
          if (drag.handle.startsWith("n")) item.y = initial.y + initial.h - item.h;
        } else {
          item.x = drag.initial.x + dx;
          item.y = drag.initial.y + dy;
          if (snapping) snapMove(item);
        }
        if (item.kind === "arrow") {
          const { a, b } = arrowPoints(item);
          for (const [id, value] of [
            ["start-x", item.x + a.x],
            ["start-y", item.y + a.y],
            ["end-x", item.x + b.x],
            ["end-y", item.y + b.y],
            ["curvature", item.curvature * 100],
          ])
            if ($(id)) $(id).value = round(value);
        }
        paint();
        ["pos-x", "pos-y", "layer-width", "layer-height"].forEach((id, index) => {
          const input = $(id);
          if (input) input.value = round([item.x, item.y, item.w, item.h][index]);
        });
      });
      function endDrag() {
        if (!drag) return;
        drag = null;
        snapGuides = [];
        changed();
        save();
      }
      canvas.addEventListener("pointerup", endDrag);
      canvas.addEventListener("pointercancel", endDrag);
      canvas.addEventListener("dblclick", () => {
        const input = $("text-value");
        if (input) {
          input.focus();
          input.select();
        }
      });

      function undo() {
        if (!undoStack.length) return;
        redoStack.push(clone(doc()));
        documents[active] = undoStack.pop();
        changed();
        syncCanvasControls();
        fitView();
      }
      function redo() {
        if (!redoStack.length) return;
        undoStack.push(clone(doc()));
        documents[active] = redoStack.pop();
        changed();
        syncCanvasControls();
        fitView();
      }
      $("undo").onclick = undo;
      $("redo").onclick = redo;
      window.addEventListener("keydown", (event) => {
        if (event.target.closest("input,textarea,select")) return;
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
          event.preventDefault();
          event.shiftKey ? redo() : undo();
          return;
        }
        if (
          (event.metaKey || event.ctrlKey) &&
          event.shiftKey &&
          ["BracketRight", "BracketLeft"].includes(event.code)
        ) {
          event.preventDefault();
          reorderLayer(event.code === "BracketRight" ? doc().layers.length - 1 : 0);
          return;
        }
        const item = layer();
        if (!item || item.locked) return;
        const directions = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1],
        };
        if (directions[event.key]) {
          event.preventDefault();
          record();
          const amount = event.shiftKey ? 10 : 1;
          item.x += directions[event.key][0] * amount;
          item.y += directions[event.key][1] * amount;
          changed();
        }
        if (event.key === "Delete" || event.key === "Backspace") {
          event.preventDefault();
          $("delete-layer")?.click();
        }
      });
      $("template").onchange = (event) => switchTemplate(event.target.value);
      $("apply-size").onclick = () => {
        const width = Number($("canvas-width").value),
          height = Number($("canvas-height").value);
        if (
          !Number.isInteger(width) ||
          !Number.isInteger(height) ||
          width < 1 ||
          height < 1 ||
          width > 8192 ||
          height > 8192
        ) {
          status("Enter canvas dimensions from 1 to 8192");
          return;
        }
        record();
        const ratio = Math.min(width / doc().width, height / doc().height);
        for (const item of doc().layers) {
          item.x *= ratio;
          item.y *= ratio;
          resizeLayer(item, ratio);
        }
        doc().width = width;
        doc().height = height;
        manualZoom = false;
        changed();
        fitView();
      };
      $("zoom-in").onclick = () => {
        zoom *= 1.15;
        manualZoom = true;
        fitView();
      };
      $("zoom-out").onclick = () => {
        zoom /= 1.15;
        manualZoom = true;
        fitView();
      };
      $("zoom-label").onclick = () => {
        manualZoom = false;
        fitView();
      };
      $("reset-layout").onclick = () => {
        record();
        documents[active] = clone(bundle.templates[active]);
        initializeMetrics(doc());
        manualZoom = false;
        selected = "headline";
        syncCanvasControls();
        changed();
        fitView();
      };
      function addText() {
        record();
        const id = "layer-" + crypto.randomUUID();
        doc().layers.push({
          id,
          kind: "text",
          name: "New text",
          x: 30,
          y: 30,
          w: 200,
          h: 50,
          text: "New text",
          font: "system",
          fontSize: 28,
          weight: 700,
          lineHeight: 1.2,
          lineGap: 0,
          color: "#101112",
          visible: true,
          locked: false,
          highlight: "",
        });
        selected = id;
        textMetrics(layer());
        changed();
      }
      $("add-text").onclick = addText;
      $("add-image").onclick = () => {
        pendingAsset = "new";
        $("image-file").click();
      };
      $("image-file").onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const key = "upload-" + crypto.randomUUID();
          const image = await loadImage(key, data);
          record();
          assets[key] = data;
          if (pendingAsset === "new") {
            const id = "layer-" + crypto.randomUUID(),
              width = Math.min(doc().width * 0.45, image.width);
            doc().layers.push({
              id,
              kind: "image",
              name: file.name,
              x: 30,
              y: 30,
              w: width,
              h: (width * image.height) / image.width,
              asset: key,
              visible: true,
              locked: false,
            });
            selected = id;
          } else {
            const item = doc().layers.find((item) => item.id === pendingAsset);
            if (item) item.asset = key;
          }
          changed();
          status("Image replaced");
        } catch (error) {
          status(error.message || "Could not load image");
        } finally {
          event.target.value = "";
          pendingAsset = null;
        }
      };
      function download(blob, name) {
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 15000);
      }
      $("export-png").onclick = async () => {
        const button = $("export-png");
        button.disabled = true;
        status("Exporting…");
        try {
          await document.fonts.ready;
          const scale = Number($("export-scale").value);
          const output = document.createElement("canvas");
          output.width = doc().width * scale;
          output.height = doc().height * scale;
          const context = output.getContext("2d", { colorSpace: "srgb" });
          context.scale(scale, scale);
          render(context, false);
          const blob = await new Promise((resolve) => output.toBlob(resolve, "image/png"));
          if (!blob) throw new Error("Export failed");
          download(blob, `xprite-${doc().language}-${output.width}x${output.height}.png`);
          status(`Exported ${output.width} × ${output.height}`);
        } catch (error) {
          status(error.message);
        } finally {
          button.disabled = false;
        }
      };
      $("save-project").onclick = () => {
        const uploads = Object.fromEntries(
          Object.entries(assets).filter(([key]) => !bundle.assets[key]),
        );
        download(
          new Blob(
            [
              JSON.stringify(
                { format: "xprite-cover-layout", version: 2, documents, active, uploads },
                null,
                2,
              ),
            ],
            { type: "application/json" },
          ),
          "xprite-cover-layout.json",
        );
        status("Layout saved");
      };
      $("load-project").onclick = () => {
        importMode = "open";
        $("project-file").click();
      };
      $("apply-layout").onclick = () => {
        importMode = "apply";
        $("project-file").click();
      };
      function validDocuments(value) {
        if (!value || typeof value !== "object") return false;
        return Object.values(value).every(
          (document) =>
            Number.isInteger(document.width) &&
            Number.isInteger(document.height) &&
            document.width >= 1 &&
            document.width <= 8192 &&
            document.height >= 1 &&
            document.height <= 8192 &&
            typeof document.background === "string" &&
            Array.isArray(document.layers) &&
            document.layers.length <= 200 &&
            document.layers.every(
              (item) =>
                typeof item.id === "string" &&
                ["text", "image", "brand", "github", "desktop", "phone", "arrow"].includes(
                  item.kind,
                ) &&
                ["x", "y", "w", "h"].every((key) => Number.isFinite(item[key])) &&
                item.w > 0 &&
                item.h > 0 &&
                (item.kind !== "arrow" ||
                  (item.start &&
                    item.end &&
                    [
                      item.start.x,
                      item.start.y,
                      item.end.x,
                      item.end.y,
                      item.curvature,
                      item.strokeWidth,
                    ].every(Number.isFinite) &&
                    item.strokeWidth > 0)),
            ),
        );
      }
      $("project-file").onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const project = JSON.parse(await file.text());
          if (
            project.format !== "xprite-cover-layout" ||
            project.version !== 2 ||
            !validDocuments(project.documents) ||
            !project.documents[project.active]
          )
            throw new Error("Select a Cover Studio layout file");
          const uploads = project.uploads || {};
          for (const data of Object.values(uploads))
            if (typeof data !== "string" || !data.startsWith("data:image/"))
              throw new Error("Invalid layout image");
          await Promise.all(Object.entries(uploads).map(([key, data]) => loadImage(key, data)));
          Object.assign(assets, uploads);
          if (importMode === "apply") applyLayout(project.documents[project.active]);
          else {
            documents = { ...clone(bundle.templates), ...project.documents };
            active = project.active;
            initializeMetrics(doc());
            selected = null;
            undoStack = [];
            redoStack = [];
            manualZoom = false;
            syncCanvasControls();
            changed();
            fitView();
            save();
            status("Project opened");
          }
        } catch (error) {
          status(error.message || "Could not open layout");
        } finally {
          event.target.value = "";
          importMode = "open";
        }
      };
      function initializeMetrics(document) {
        for (const item of document.layers)
          if (["text", "github"].includes(item.kind)) {
            textMetrics(item, !!item.fit);
            delete item.fit;
          }
      }
      async function initialize() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (saved && validDocuments(saved.documents) && saved.documents[saved.active]) {
            documents = { ...documents, ...saved.documents };
            active = saved.active;
            for (const [key, data] of Object.entries(saved.uploads || {}))
              if (typeof data === "string" && data.startsWith("data:image/")) assets[key] = data;
          }
        } catch {}
        await Promise.all(
          Object.entries(bundle.fonts).map(async ([key, font]) => {
            const face = new FontFace("Cover-" + key, `url(${font.data})`, { weight: "100 900" });
            await face.load();
            document.fonts.add(face);
          }),
        );
        await Promise.all(Object.entries(assets).map(([key, data]) => loadImage(key, data)));
        await document.fonts.ready;
        for (const document of Object.values(documents)) initializeMetrics(document);
        ready = true;
        syncCanvasControls();
        drawLayers();
        drawInspector();
        fitView();
        status("");
        document.documentElement.dataset.editorReady = "true";
      }
      new ResizeObserver(() => {
        if (ready) fitView();
      }).observe($("stage-area"));
      initialize().catch((error) => status("Could not load: " + error.message));
    })();
  </script>
</html>
