<html lang="zh-CN">
  <meta charset="utf-8" /><title>Xprite Cover</title
  ><style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #ffffff;
      font-family: -apple-system, "PingFang SC", "Heiti SC", Arial, sans-serif;
      color: #101112;
    }
    .brand {
      position: absolute;
      left: 62px;
      top: 162px;
      height: 154px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }
    .brand img {
      width: 154px;
      height: 154px;
      image-rendering: pixelated;
      border-radius: 18px;
    }
    .brand span {
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: 101px;
      line-height: 0.88;
      padding-bottom: 26px;
    }
    .headline {
      position: absolute;
      left: 62px;
      top: 490px;
      width: 514px;
      font-size: 85px;
      font-weight: 750;
      line-height: 1.2;
    }
    .headline > div + div {
      margin-top: 34px;
    }
    mark {
      background: #fff4a7;
      color: inherit;
      padding: 0 2px;
    }
    .footer {
      position: absolute;
      left: 66px;
      top: 782px;
      font-size: 43px;
    }
    .github-link {
      position: absolute;
      display: flex;
      align-items: center;
      white-space: nowrap;
      color: inherit;
      text-decoration: none;
    }
    .github-link img {
      display: block;
    }
    .desktop-cursor {
      position: absolute;
      pointer-events: none;
      image-rendering: pixelated;
    }
    .browser {
      position: absolute;
      left: 600px;
      top: 94px;
      width: 1238px;
      box-sizing: content-box;
      border: 1px solid #41464d;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 24px #0002;
    }
    .browser-bar {
      height: 53px;
      background: #f2f3f5;
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 10px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff6259;
    }
    .dot.yellow {
      background: #ffbe2e;
    }
    .dot.green {
      background: #2bc841;
    }
    .address {
      margin-left: 72px;
      background: #e5e7ea;
      border-radius: 16px;
      padding: 4px 19px;
      flex: 1;
      font-size: 20px;
      height: 35px;
    }
    .photo {
      display: block;
      max-width: none;
      max-height: none;
      image-rendering: auto;
    }
    .phone {
      position: absolute;
      background: #242528;
      border-radius: var(--radius);
      box-shadow:
        inset 0 0 0 2px #94979b,
        0 12px 24px #0002;
    }
    .screen {
      position: absolute;
      left: var(--inset);
      top: var(--inset);
      width: var(--screen-width);
      height: var(--screen-height);
      overflow: hidden;
      border-radius: var(--screen-radius);
      background: #f4f5f7;
    }
    .status {
      position: relative;
      font:
        600 14px -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.2px;
    }
    .status span {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%);
    }
    .status i {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 101px;
      height: 20px;
      background: #111;
      border-radius: 20px;
    }
    .mobile-address {
      padding: 5px 19px;
    }
    .mobile-address span {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: #e3e5e8;
      border-radius: 1199px;
      font:
        400 17px -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }
    .side {
      position: absolute;
      background: #4d5157;
      width: 4px;
      border-radius: 2px;
    }
    .volume {
      left: -2px;
      top: 27%;
      height: 17%;
    }
    .power {
      right: -2px;
      top: 35%;
      height: 18%;
    }
    .arrow {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }
    .browser-icons {
      position: absolute;
      display: flex;
      align-items: center;
    }
    .browser-icons img {
      display: block;
      object-fit: contain;
    }
  </style>
