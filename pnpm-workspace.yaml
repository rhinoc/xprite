packages:
  - apps/*
  - apps/growth/content
  - apps/growth/public
  - packages/*
  - services/*

allowBuilds:
  '@posthog/cli': true
  core-js: true
  # The pure polyfill's postinstall only prints a funding message.
  core-js-pure: false
  esbuild: true
  # Wrangler uses workerd's installer to select its native runtime binary.
  workerd: true

# dependency-cruiser 18 uses the TypeScript compiler API that changed in v7.
packageExtensions:
  dependency-cruiser@^18.4.0:
    dependencies:
      typescript: 6.0.3
  # check-unused-css currently relies on typescript-estree, which supports TypeScript < 6.1.
  check-unused-css@^0.5.5:
    dependencies:
      typescript: 6.0.3
