name: Visual audits

# Runs only when files that can change rendering do; the pre-push hook runs the same audits.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/visual-audit/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  visual:
    name: Visual audits (Playwright Chromium)
    runs-on: ubuntu-latest
    # Microsoft's Playwright image ships Chromium and its system packages, so there is no browser
    # download or apt install. Its tag must equal the installed playwright version (checked below);
    # bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright image matches the installed version
        run: |
          installed="$(pnpm exec playwright --version | awk '{print $2}')"
          test "$installed" = "1.64.0" || {
            echo "playwright is $installed; update the container image tag in visual.yml." >&2
            exit 1
          }
      # visual builds the production site itself (pnpm run build:site), ui included.
      - run: pnpm run visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ github.run_id }}
          path: |
            .tmp/visual-report
            .tmp/xprite-visual
            .tmp/site-visual
            .tmp/startup-continuity
            .tmp/tools-startup-visual
          include-hidden-files: true
          retention-days: 7
