name: Visual audits

# Runs only when files that can change rendering do; the pre-push hook runs the same audits.
on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/visual-audit/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/visual.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  visual:
    name: Visual audits (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      # Measured: the mcr.microsoft.com/playwright container costs ~34 s to initialise, more than
      # the ~12 s install-deps it saves, so the job stays on the runner image.
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # visual builds the production site itself (pnpm run build:site), ui included.
      - run: pnpm run visual
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report-${{ github.run_id }}
          path: |
            .tmp/visual-report
            .tmp/xprite-visual
            .tmp/site-visual
            .tmp/startup-continuity
            .tmp/tools-startup-visual
          include-hidden-files: true
          retention-days: 7
