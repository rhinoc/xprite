name: Deploy editor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to deploy (empty uses the selected branch)"
        required: false
        type: string
      environment:
        description: "Target environment (first deployment must be production)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      indexnow_all:
        description: "Submit every sitemap page to IndexNow, not just changed pages (production only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: edgeone-editor-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}
    env:
      HUSKY: "0"
      EDGEONE_ENV: ${{ inputs.environment || 'production' }}
      EDGEONE_PROJECT_NAME: ${{ vars.EDGEONE_PROJECT_NAME || 'xprite' }}
      EDGEONE_AREA: ${{ vars.EDGEONE_AREA }}
      VITE_POSTHOG_REGION: ${{ vars.VITE_POSTHOG_REGION || 'US' }}
      VITE_POSTHOG_API_HOST: ${{ vars.VITE_POSTHOG_API_HOST }}
      VITE_POSTHOG_PROJECT_TOKEN: ${{ (inputs.environment || 'production') == 'production' && vars.VITE_POSTHOG_PROJECT_TOKEN || '' }}

    outputs:
      deploy_ref: ${{ steps.revision.outputs.ref }}
      release: ${{ steps.revision.outputs.release }}
      archive_saved: ${{ steps.archive.outcome == 'success' }}

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate public documentation
        run: pnpm run check:public-docs

      - name: Validate deployment configuration
        run: pnpm run deploy:validate
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          POSTHOG_CLI_API_KEY: ${{ (inputs.environment || 'production') == 'production' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ (inputs.environment || 'production') == 'production' && secrets.POSTHOG_CLI_API_KEY != '' && vars.POSTHOG_CLI_PROJECT_ID || '' }}

      - name: Record actual build revision
        id: revision
        run: |
          release="$(git rev-parse HEAD)"
          ref="$(git describe --tags --exact-match HEAD 2>/dev/null || git rev-parse --short HEAD)"
          echo "POSTHOG_RELEASE=$release" >> "$GITHUB_ENV"
          echo "DEPLOY_REF=$ref" >> "$GITHUB_ENV"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Validate EdgeOne configuration
        run: pnpm exec edgeone validate

      - name: Build website and upload optional editor source maps
        run: pnpm run build:site
        env:
          POSTHOG_CLI_API_KEY: ${{ (inputs.environment || 'production') == 'production' && secrets.POSTHOG_CLI_API_KEY || '' }}
          POSTHOG_CLI_PROJECT_ID: ${{ (inputs.environment || 'production') == 'production' && secrets.POSTHOG_CLI_API_KEY != '' && vars.POSTHOG_CLI_PROJECT_ID || '' }}

      # Content-hashed files of the last 3 production releases stay deployable so open tabs of
      # those releases can still lazy-load their chunks (scripts/deploy/README.md).
      - name: Fetch previous release assets (production only)
        if: env.EDGEONE_ENV == 'production'
        run: pnpm run deploy:previous-assets fetch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare static deployment
        run: pnpm run deploy:prepare

      - name: Save deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ env.EDGEONE_ENV }}-${{ env.POSTHOG_RELEASE }}
          path: .tmp/deploy/editor/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      # IndexNow is best effort: a failed ping never blocks or fails a verified deployment.
      - name: Plan IndexNow submission (production only)
        if: env.EDGEONE_ENV == 'production'
        continue-on-error: true
        run: pnpm run deploy:indexnow:plan
        env:
          INDEXNOW_ALL: ${{ inputs.indexnow_all && '1' || '' }}

      - name: Publish and verify deployed revision
        id: publish
        run: pnpm run deploy:editor
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      # Only a verified production deployment of a v* tag hands its archive to archive-assets.
      - name: Save release asset archive (production tags only)
        id: archive
        if: env.EDGEONE_ENV == 'production' && startsWith(env.DEPLOY_REF, 'v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ env.POSTHOG_RELEASE }}
          path: .tmp/deploy/release-assets/
          if-no-files-found: error
          retention-days: 7

      - name: Submit changed pages to IndexNow (production only)
        if: env.EDGEONE_ENV == 'production'
        continue-on-error: true
        run: pnpm run deploy:indexnow:submit

      - name: Save deployment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/deploy/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # The next production deployments download this archive (deploy:previous-assets fetch). It is
  # the only job that writes to the repository: it attaches the archive to the tag's GitHub release.
  archive-assets:
    name: Attach content-hashed assets to the release
    needs: deploy
    if: needs.deploy.outputs.archive_saved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.deploy.outputs.deploy_ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ needs.deploy.outputs.release }}
          path: release-assets

      - name: Upload archive to the tag's release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # Release notes are written by hand later (gh release edit "$TAG" --notes-file …).
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "Production deployment of $TAG. Release notes follow."
          fi
          gh release upload "$TAG" release-assets/*.tar.gz --clobber
