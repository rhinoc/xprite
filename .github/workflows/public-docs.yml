name: Public documentation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-docs:
    name: Public documentation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pnpm run check:public-docs
